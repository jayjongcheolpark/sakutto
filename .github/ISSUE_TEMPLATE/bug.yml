name: 不具合の報告 / Bug report
description: 翻訳できない、落ちる、表示が壊れるなど。Something is not working.
title: '[Bug] '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        先に既存の Issue を検索してください。Issue のあと、できるならその Issue への pull request も大歓迎です。Issue だけでも十分です。

        **個人情報、認証情報、ログインが必要なページの本文は貼らないでください。** 公開してよい情報だけを書いてください。URL にトークンやメールアドレスが含まれる場合は削除してください。

        Please search existing issues first. A PR for the issue is very welcome if you can; the issue alone is also enough. **Do not paste private page content, credentials, or personal data.** Redact tokens and email addresses from any URL.

        WebGPU が CPU に落ちたときは、設定の診断にある「コピー」で端末上のアダプタ報告を Issue に貼れます。その報告は端末の外へは送られません。

        If WebGPU fell back to CPU, Settings → Diagnostics has a Copy button for the adapter report. It never leaves the device until you paste it.

  - type: input
    id: chrome
    attributes:
      label: Chrome のバージョン / Chrome version
      description: '`chrome://version` の Google Chrome の行。 The Google Chrome line from chrome://version.'
      placeholder: '131.0.6778.86'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: 例 / example — Windows 11, macOS 15, Ubuntu 24.04.
      placeholder: Windows 11
    validations:
      required: true

  - type: input
    id: sakutto
    attributes:
      label: Sakutto のバージョン / Sakutto version
      description: |
        `chrome://extensions` でデベロッパー モードをオンにすると表示されます。Chrome ウェブストアのバージョンでも構いません。
        Shown on chrome://extensions with Developer mode on, or the Chrome Web Store version.
      placeholder: '1.0.2'
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: CPU または GPU / WebGPU
      description: 設定やオンボーディングで表示される実行経路。 The runtime shown in settings or onboarding.
      options:
        - CPU
        - GPU / WebGPU
        - わからない / Not sure
    validations:
      required: true

  - type: input
    id: languages
    attributes:
      label: 言語の組み合わせ / Language pair
      description: 訳元から訳先。 From source to target.
      placeholder: 英語 → 日本語 / English to Japanese
    validations:
      required: true

  - type: dropdown
    id: page-type
    attributes:
      label: ページの種類 / Page type
      description: 公開 URL は任意です。ログインが必要なページの URL は書かないでください。 A public URL is optional later. Do not share a logged-in page.
      options:
        - 記事 / Article
        - ニュース / News
        - ドキュメント / Docs
        - 動的ページ / SPA
        - フォーム / Form
        - その他 / Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Steps to reproduce
      description: 番号付きで書いてください。非公開の本文は貼らないでください。 Numbered steps. Do not paste private text.
      placeholder: |
        1. 拡張機能を読み込む / Load the extension
        2. 公開されている記事を開く / Open a public article
        3. Alt+A で翻訳する / Translate with Alt+A
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した動き / Expected
      description: 個人情報は書かないでください。 Do not include personal data.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動き / Actual
      description: エラーメッセージがあれば、個人情報を消してから貼ってください。 Paste error text only after redacting personal data.
    validations:
      required: true

  - type: textarea
    id: webgpu-diagnostic
    attributes:
      label: WebGPU の診断（任意） / WebGPU diagnostic (optional)
      description: |
        設定 → エンジン → 診断の「コピー」の内容。個人情報は含まれません。端末の外へは送られません。
        The Copy button under Settings → Engine → Diagnostics. It stays on the device until you paste it.

  - type: input
    id: public-url
    attributes:
      label: 公開 URL（任意） / Public URL (optional)
      description: |
        誰でも開けるページだけ。ログイン、社内、メール、管理画面の URL は書かないでください。
        Public pages only. Do not share logged-in, intranet, mail, or admin URLs.

  - type: checkboxes
    id: privacy
    attributes:
      label: プライバシー / Privacy
      options:
        - label: 個人情報、認証情報、非公開ページの本文は貼っていません。 I have not pasted personal data, credentials, or private page content.
          required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: pull request
      description: 必須ではありません。Issue だけでも歓迎です。 Optional. An issue by itself is welcome.
      options:
        - label: できればこの Issue の PR を出してみたい / I'd like to open a PR for this
          required: false
